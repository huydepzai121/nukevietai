# Stack phát triển cục bộ cho NukeViet.
#
# Chỉ dùng trên máy cá nhân: MariaDB để mật khẩu root rỗng, PHP bật display_errors.
# KHÔNG đem cấu hình này lên máy chủ thật.
#
# Cổng và dải mạng chọn lệch với hstdt-docker (8080/8443, 3306, 172.18.0.0/16)
# để hai stack chạy song song được.
#
#   docker compose up -d --build
#   http://nukeviet.local:8088       (thêm dòng hosts, xem docs/docker.md)
#   http://db.nukeviet.local:8088    (phpMyAdmin)

name: nukeviet

networks:
  nukeviet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          ip_range: 172.21.5.0/24

services:
  nukeviet_web:
    container_name: nukeviet_web
    hostname: nukeviet_web
    build:
      context: ./.docker/php
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    volumes:
      - .:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/zz-nukeviet.ini:ro
      - ./.docker/apache/nukeviet.conf:/etc/apache2/conf-enabled/zz-nukeviet.conf:ro
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    networks:
      nukeviet:
        ipv4_address: 172.21.5.1
        aliases:
          - nukeviet.local
    depends_on:
      nukeviet_db:
        condition: service_healthy
    restart: unless-stopped

  nukeviet_db:
    container_name: nukeviet_db
    hostname: nukeviet_db
    image: docker.io/mariadb:11.5
    volumes:
      - ./.docker/mariadb/nukeviet.cnf:/etc/mysql/conf.d/nukeviet.cnf:ro
      - nukeviet_mysql:/var/lib/mysql
      - ./.docker/mariadb/dump:/home
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
      MARIADB_DATABASE: ${DB_NAME:-nukeviet}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      nukeviet:
        ipv4_address: 172.21.5.2
    restart: unless-stopped

  nukeviet_pma:
    container_name: nukeviet_pma
    hostname: nukeviet_pma
    image: docker.io/phpmyadmin:5.2-apache
    # Mở cổng riêng để vào được bằng localhost khi chưa thêm dòng vào file hosts
    # (thêm hosts cần quyền quản trị). Có hosts rồi thì dùng db.nukeviet.local:8088.
    ports:
      - "${PMA_PORT:-8089}:80"
    environment:
      PMA_HOST: nukeviet_db
      PMA_USER: root
      UPLOAD_LIMIT: 256M
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      - nukeviet_db
    networks:
      nukeviet:
        ipv4_address: 172.21.5.3
        aliases:
          - db.nukeviet.local
    restart: unless-stopped

  nukeviet_proxy:
    container_name: nukeviet_proxy
    hostname: nukeviet_proxy
    image: docker.io/nginx:1.27
    volumes:
      - ./.docker/nginx:/etc/nginx/conf.d:ro
    ports:
      - "${HTTP_PORT:-8088}:80"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    networks:
      nukeviet:
        ipv4_address: 172.21.5.4
    depends_on:
      - nukeviet_web
      - nukeviet_pma
    restart: unless-stopped

# Dữ liệu MariaDB nằm trong volume do Docker quản lý, không bind mount từ ổ Windows:
# bind mount đi qua lớp chia sẻ tệp nên chậm hơn nhiều với thành phần đọc ghi đĩa nặng.
#
# Sao lưu:  docker run --rm -v nukeviet_mysql:/d -v "$PWD:/b" alpine tar czf /b/nukeviet-mysql.tar.gz -C /d .
volumes:
  nukeviet_mysql:
    name: nukeviet_mysql
