# Reverse proxy cho các domain ảo của NukeViet.
#
# Host được chuyển tiếp bằng $http_host (KHÔNG phải $host): $http_host giữ nguyên
# cả cổng người dùng gõ, ví dụ "nukeviet.local:8088". NukeViet dựng URL tuyệt đối
# từ HTTP_HOST, nếu mất cổng thì mọi liên kết sinh ra sẽ trỏ sai.

# Chặn truy cập bằng IP hoặc tên miền lạ
server {
    listen      80 default_server;
    server_name _;
    return      404;
}

# localhost và 127.0.0.1 nhận cùng vhost với nukeviet.local, để dùng được ngay
# khi chưa kịp thêm dòng vào file hosts (việc đó cần quyền quản trị).
server {
    listen      80;
    server_name nukeviet.local localhost 127.0.0.1;

    client_max_body_size 256M;

    location / {
        proxy_pass http://nukeviet_web:80;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffer_size        32k;
        proxy_buffers            8 64k;
        proxy_busy_buffers_size  128k;
        proxy_max_temp_file_size 0;
    }
}

server {
    listen      80;
    server_name db.nukeviet.local;

    client_max_body_size 256M;

    location / {
        proxy_pass http://nukeviet_pma:80;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }
}
