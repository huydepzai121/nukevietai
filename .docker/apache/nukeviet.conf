# Apache cho NukeViet — nạp vào /etc/apache2/conf-enabled/
#
# AllowOverride All là bắt buộc: .htaccess ở gốc repo chứa toàn bộ luật rewrite
# đường dẫn thân thiện và các luật chặn truy cập vào includes/, vendor/,
# data/cache/, data/logs/…

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Chặn truy cập trực tiếp vào thư mục hạ tầng và thư mục thiết kế tĩnh
<DirectoryMatch "^/var/www/html/(\.docker|\.git|\.claude|plans)">
    Require all denied
</DirectoryMatch>

# Ghi đúng IP người dùng khi đứng sau nginx reverse proxy
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 172.21.0.0/16
