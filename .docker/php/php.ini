; Cấu hình PHP cho NukeViet ở môi trường phát triển cục bộ.
; Nạp vào /usr/local/etc/php/conf.d/ nên ghi đè php.ini mặc định của ảnh nền.

expose_php = Off
memory_limit = 256M
max_execution_time = 120

; NukeViet cho phép tải lên ảnh và tệp đính kèm cỡ lớn
file_uploads = On
upload_max_filesize = 256M
post_max_size = 256M
max_file_uploads = 50

date.timezone = Asia/Ho_Chi_Minh

; Bật lỗi để thấy ngay khi phát triển — KHÔNG dùng cấu hình này cho máy chủ thật
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; opcache: bật kiểm tra dấu thời gian để sửa file là thấy đổi ngay
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

session.gc_maxlifetime = 7200
