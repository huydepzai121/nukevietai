<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Nút — Nhật Trình</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Noto+Serif:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../../themes/default/css/bootstrap.min.css">
<link rel="stylesheet" href="../tokens.css">

<style>
body { padding: 32px; }
.pv { display: flex; flex-direction: column; gap: 28px; max-width: 1080px; }
.pv-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }

<main class="pv">
<h2 class="section-title">Nút</h2>
<div class="pv-row">

<div class="pv-row">
<button class="btn btn-primary btn-sm">Nhỏ</button>

<button class="btn btn-primary btn-lg">Lớn</button>
</div>
<div style="max-width:320px"><button class="btn btn-primary btn-block">Nút rộng hết khối</button></div>
